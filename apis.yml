name: FamilyLeaf
description: >-
  FamilyLeaf was a private social network for families, launched in 2012 and marketed as "a place to
  share your life with your family" — a closed, invite-based space for sharing photos and updates
  among relatives rather than a public feed. The company was surfaced as a portfolio company of
  500 Global and added to the API Evangelist network as a stub for enrichment. Enrichment probes on
  2026-07-20 found no operating company: familyleaf.com is registered (GoDaddy, registry expiry
  2027-03-09) but delegated to no nameservers at all, so it has no A record, no mail, no website and
  no API surface. The last live archived snapshot of the product (2014) carries a banner announcing
  that FamilyLeaf had become part of Origami; by the 2023 archived snapshot the domain was serving a
  registrar parking page. There is no developer portal, documentation, SDK, GitHub organization, or
  any other API artifact to capture. This profile is retained as a historical company record.
